name: Demo

# Builds the example app for the web and publishes it to GitHub Pages, so the
# README can link to something people can actually click.
#
# One-time setup in the repository: Settings → Pages → Source → GitHub Actions.

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Pages needs these; the default token is read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling, so the last push
# always wins rather than whichever finishes first.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build the example for the web
        working-directory: example
        # The base href has to match the repository path, or every asset 404s
        # on a project Pages site.
        run: |
          flutter pub get
          flutter build web --release --base-href /hint_kit/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: example/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
