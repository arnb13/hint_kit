name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # Lets a maintainer re-run the checks without pushing an empty commit.
  workflow_dispatch:

# A new push to the same branch cancels the run it supersedes: the old result
# is about to be irrelevant and the runner minutes are not free.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # The package's own floor, not "latest": CI must fail when a change
          # needs an API newer than pubspec.yaml promises to support.
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          flutter pub get --directory=example

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test example/lib

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter=expanded

      - name: Test the example
        run: flutter test --reporter=expanded
        working-directory: example

      # Goldens fail as a pixel diff, which is unreadable in a log. The images
      # the run produced are the only useful artefact.
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/failures/
          if-no-files-found: ignore

  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Catches the things only the packaging step sees: a missing licence, a
      # bad pubspec, files that would not ship.
      - name: pub publish --dry-run
        run: flutter pub publish --dry-run
