name: hint_kit
description: >-
  Tooltips, persistent hints and spotlight guided tours from one overlay
  engine, one placement resolver and one theme. Zero runtime dependencies.
version: 0.1.0
repository: https://github.com/arnb13/hint_kit
issue_tracker: https://github.com/arnb13/hint_kit/issues
documentation: https://github.com/arnb13/hint_kit#readme

screenshots:
  - description: >-
      A hint on a disabled button, the ready-made designs, a queue of tips and
      the four-step tour, recorded from the example app.
    path: screenshots/hint_kit.gif
  - description: >-
      A hint on a disabled button — the case most people arrive here for.
    path: screenshots/1-hint-on-disabled.png
  - description: >-
      A tour step: the spotlight cuts a real hole in the scrim and the card is
      the same bubble a tooltip uses.
    path: screenshots/4-tour-step.png
  - description: >-
      The same screen in dark mode. The bubble inverts on its own, with no
      configuration.
    path: screenshots/6-dark-mode.png

topics:
  - tooltip
  - onboarding
  - overlay
  - showcase
  - ui

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
